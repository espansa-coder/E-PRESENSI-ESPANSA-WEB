
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10264F">

  <title>Login - E-PRESENSI ESPANSA</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">

      <div class="login-brand">
        <img
          src="assets/images/logo-smpn-panawangan.png"
          alt="Logo SMP Negeri 1 Panawangan"
          class="login-logo"
        >

        <h1>E-PRESENSI ESPANSA</h1>
        <p>SMP Negeri 1 Panawangan</p>
      </div>

      <div class="login-divider"></div>

      <div class="login-heading">
        <h2>Selamat Datang</h2>
        <p>Silakan masuk menggunakan akun Anda</p>
      </div>

      <form class="login-form">

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Masukkan username"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button type="button" class="login-button">
          MASUK
        </button>

      </form>

      <div class="login-notice">
        <span class="notice-dot"></span>
        Lingkungan Pengembangan (WEB)
      </div>

      <p class="login-footer">
        © 2026 SMP Negeri 1 Panawangan
        <br>
        E-PRESENSI ESPANSA
      </p>

    </section>

  </main>

</body>
</html>
