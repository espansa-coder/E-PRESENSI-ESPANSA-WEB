<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wali Kelas - E-Presensi Espansa</title>
<style>
  :root { --navy:#10264F; --ink:#17202e; --mute:#5b6678; --line:#d5dbe6; --bg:#eef1f6; --ok:#0b7a43; --warn:#a15c00; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  [hidden] { display:none !important; }
  button, input { font:inherit; min-height:40px; border-radius:6px; border:1px solid var(--line); padding:6px 12px; background:#fff; color:var(--ink); }
  button { cursor:pointer; } button.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  button:focus-visible, input:focus-visible { outline:3px solid #4a7fd8; outline-offset:2px; }
  .box { max-width:380px; margin:8vh auto; background:#fff; padding:24px; border-radius:10px; border:1px solid var(--line); }
  .box h1 { margin:0 0 4px; font-size:1.25rem; color:var(--navy); } .box p { margin:0 0 10px; color:var(--mute); font-size:.9rem; }
  .box label { display:block; font-size:.85rem; color:var(--mute); margin:10px 0 2px; } .box input, .box button { width:100%; } .box button { margin-top:16px; }
  .err { color:var(--bad); min-height:1.4em; margin-top:8px; }
  header { background:var(--navy); color:#fff; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.05rem; flex:1; } header button { background:transparent; color:#fff; border-color:rgba(255,255,255,.4); min-height:34px; }
  .env { background:#f0b429; color:#2a1d00; font-size:.72rem; font-weight:700; padding:1px 8px; border-radius:99px; margin-left:8px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); }
  .bar .sp { flex:1; } #upd { color:var(--mute); font-size:.85rem; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; } .card b { display:block; font-size:1.5rem; line-height:1.15; } .card span { font-size:.82rem; color:var(--mute); }
  .card.ok b, .ok { color:var(--ok); } .card.warn b, .warn { color:var(--warn); } .card.bad b, .bad { color:var(--bad); } .muted { color:var(--mute); }
  .wrap { background:#fff; border:1px solid var(--line); border-radius:8px; overflow-x:auto; } table { border-collapse:collapse; width:100%; min-width:560px; }
  th, td { padding:7px 10px; text-align:left; border-bottom:1px solid #edf0f5; white-space:nowrap; } th { background:#f6f8fb; font-size:.82rem; color:var(--mute); }
  #q { width:100%; max-width:320px; margin-bottom:10px; } #empty { color:var(--mute); padding:24px; text-align:center; }
</style>
</head>
<body>
<section id="login" class="box">
  <h1>Wali Kelas <span class="env">DEV</span></h1><p>E-Presensi Espansa, SMP Negeri 1 Panawangan</p>
  <form id="f" autocomplete="off">
    <label for="u">NIP (username)</label><input id="u" inputmode="numeric" required>
    <label for="p">Password</label><input id="p" type="password" required>
    <button class="primary" id="lbtn" type="submit">Masuk</button><div class="err" id="lerr" role="alert"></div>
  </form>
</section>

<section id="chg" class="box" hidden>
  <h1>Ganti password</h1><p>Demi keamanan, ganti password awal Anda sebelum melanjutkan. Minimal 10 karakter.</p>
  <form id="f2" autocomplete="off">
    <label for="o">Password lama</label><input id="o" type="password" required>
    <label for="n1">Password baru</label><input id="n1" type="password" minlength="10" required>
    <label for="n2">Ulangi password baru</label><input id="n2" type="password" minlength="10" required>
    <button class="primary" type="submit">Simpan password</button><div class="err" id="cerr" role="alert"></div>
  </form>
</section>

<section id="app" hidden>
  <header><h1>Kelas <span id="kls"></span> <span class="env">DEV</span></h1><span id="who"></span><button id="out" type="button">Keluar</button></header>
  <div class="bar"><label for="tgl">Tanggal</label><input id="tgl" type="date"><span class="sp"></span><span id="upd"></span><button id="ref" type="button">Muat ulang</button></div>
  <main>
    <div id="empty" hidden></div>
    <div id="data">
      <div class="cards" id="cards"></div>
      <input id="q" placeholder="Cari nama atau NIS" aria-label="Cari siswa">
      <div class="wrap"><table><thead><tr><th>Nama</th><th>NIS</th><th>Masuk</th><th>Zuhur</th><th>Pulang</th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
  </main>
</section>

<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbzxlDM0vbjCH8MCDHafTl9njW3d4XW7fJJ8yY6OSjinWkEEF1wId5k8eMEUREedXCHZkw/exec';
  var $ = function (i) { return document.getElementById(i); };
  var token = null, data = null, timer = null, oldPw = '';
  var LBL = { HADIR: 'Hadir', TERLAMBAT: 'Terlambat', SAKIT: 'Sakit', IZIN: 'Izin', ALPA: 'Alpa', BELUM_PRESENSI: 'Belum', TIDAK_PRESENSI: 'Tidak presensi', BEBAS: 'Bebas', TIDAK_BERLAKU: '-' };
  var CLS = { HADIR: 'ok', TERLAMBAT: 'warn', ALPA: 'bad', BELUM_PRESENSI: 'muted', TIDAK_PRESENSI: 'muted', BEBAS: 'muted', TIDAK_BERLAKU: 'muted' };

  function api(action, payload) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: token, payload: payload }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error.message); e.code = j.error.code; throw e; } return j.data; });
  }
  function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
  function today() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta' }).format(new Date()); }
  function show(id) { ['login', 'chg', 'app'].forEach(function (x) { $(x).hidden = x !== id; }); }
  function toLogin(msg) { clearInterval(timer); token = null; sessionStorage.removeItem('ep.wali'); show('login'); $('lerr').textContent = msg || ''; }

  $('f').onsubmit = function (e) {
    e.preventDefault(); $('lbtn').disabled = true; $('lerr').textContent = ''; oldPw = $('p').value;
    api('login', { username: $('u').value, password: oldPw, clientId: 'wali-web' }).then(function (d) {
      if (d.user.role !== 'WALI_KELAS') { token = d.token; return api('logout', {}).then(function () { token = null; throw new Error('Akun ini bukan Wali Kelas.'); }); }
      token = d.token; sessionStorage.setItem('ep.wali', token); $('who').textContent = d.user.nama; $('p').value = '';
      if (d.mustChange) { show('chg'); } else { start(); }
    }).catch(function (x) { $('lerr').textContent = x.message; }).then(function () { $('lbtn').disabled = false; });
  };
  $('f2').onsubmit = function (e) {
    e.preventDefault(); $('cerr').textContent = '';
    if ($('n1').value !== $('n2').value) { $('cerr').textContent = 'Password baru dan pengulangannya tidak sama.'; return; }
    api('auth.changePassword', { oldPassword: $('o').value, newPassword: $('n1').value }).then(function () {
      $('o').value = $('n1').value = $('n2').value = ''; start();
    }).catch(function (x) { $('cerr').textContent = x.message; });
  };
  $('out').onclick = function () { var d = function () { toLogin(''); }; api('logout', {}).then(d, d); };

  function start() { show('app'); if (!$('tgl').value) $('tgl').value = today(); load(); clearInterval(timer); timer = setInterval(load, 60000); }
  function load() {
    api('wali.rekap', { tanggal: $('tgl').value }).then(function (d) {
      data = d; if (d.kelas[0]) $('kls').textContent = d.kelas[0].kelas;
      $('upd').textContent = 'Diperbarui ' + new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
      render();
    }).catch(function (e) {
      if (e.code === 'SESI_BERAKHIR') return toLogin('Sesi berakhir. Silakan login kembali.');
      if (e.code === 'WAJIB_GANTI_PASSWORD') return show('chg');
      data = null; $('empty').hidden = false; $('data').hidden = true; $('empty').textContent = e.message;
    });
  }
  function cell(st, jam) { var td = el('td'); td.appendChild(el('span', LBL[st] || st || '-', CLS[st] || '')); if (jam) td.appendChild(el('span', '  ' + jam, 'muted')); return td; }
  function render() {
    var ok = !!(data && data.ada);
    $('empty').hidden = ok; $('data').hidden = !ok;
    if (!ok) { $('empty').textContent = 'Belum ada data presensi untuk tanggal ini.'; return; }
    var t = data.total.MASUK, cards = $('cards'); cards.textContent = '';
    [['Siswa', null, ''], ['Hadir', 'HADIR', 'ok'], ['Terlambat', 'TERLAMBAT', 'warn'], ['Sakit', 'SAKIT', ''], ['Izin', 'IZIN', ''], ['Alpa', 'ALPA', 'bad'], ['Belum', 'BELUM_PRESENSI', '']].forEach(function (c) {
      var d = el('div', undefined, 'card ' + c[2]); d.appendChild(el('b', String(c[1] ? (t[c[1]] || 0) : data.jumlah))); d.appendChild(el('span', c[1] ? c[0] + ' (masuk)' : c[0])); cards.appendChild(d);
    });
    var q = $('q').value.trim().toLowerCase(), tb = $('tb'); tb.textContent = '';
    data.siswa.filter(function (s) { return !q || s[0].toLowerCase().indexOf(q) >= 0 || String(s[1]).indexOf(q) >= 0; }).forEach(function (s) {
      var tr = el('tr'); tr.appendChild(el('td', s[0])); tr.appendChild(el('td', s[1], 'muted'));
      tr.appendChild(cell(s[2], s[3])); tr.appendChild(cell(s[4], s[5])); tr.appendChild(cell(s[6], s[7])); tb.appendChild(tr);
    });
  }
  $('tgl').onchange = load; $('ref').onclick = load; $('q').oninput = render;

  var saved = sessionStorage.getItem('ep.wali');
  if (saved) { token = saved; start(); }
})();
</script>
</body>
</html>
