<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Kamera Scanner - E-Presensi Espansa</title>
<style>
  :root { --navy:#10264F; --ink:#17202e; --mute:#5b6678; --line:#d5dbe6; --bg:#f4f6fa; --ok:#0b7a43; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--navy); color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:1.15rem; }
  header p { margin:2px 0 0; font-size:.9rem; opacity:.8; }
  main { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:16px; padding:16px; max-width:1100px; margin:0 auto; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  .cam { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:16/9; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .guide { position:absolute; inset:30% 15%; border:3px solid rgba(255,255,255,.85); border-radius:6px; pointer-events:none; }
  .flash { position:absolute; inset:0; background:rgba(11,122,67,.35); opacity:0; transition:opacity .25s; pointer-events:none; }
  .flash.on { opacity:1; transition:none; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  select, button { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; min-height:44px; }
  button.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  button:focus-visible, select:focus-visible { outline:3px solid #4a7fd8; outline-offset:2px; }
  dl { margin:0 0 10px; display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:.92rem; }
  dt { color:var(--mute); }
  dd { margin:0; overflow-wrap:anywhere; }
  #last { font-size:1.6rem; font-weight:700; letter-spacing:.04em; min-height:2.2rem; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ol { margin:0; padding-left:1.3rem; max-height:220px; overflow:auto; font-size:.9rem; }
  .hint { color:var(--mute); font-size:.88rem; margin:8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Uji kamera scanner</h1>
  <p>Cek apakah Chromebook ini bisa membaca barcode Code 128 pada kartu siswa.</p>
</header>
<main>
  <section>
    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="guide"></div>
      <div class="flash" id="flash"></div>
    </div>
    <p class="hint">Arahkan barcode ke dalam kotak. Coba jarak dekat dan jauh, serta barcode di layar HP dan di kartu cetak.</p>
  </section>
  <section class="panel">
    <div class="row">
      <select id="cams" aria-label="Pilih kamera"></select>
      <button id="start" class="primary">Mulai</button>
      <button id="stop">Berhenti</button>
    </div>
    <div id="last" aria-live="polite">-</div>
    <dl>
      <dt>Mesin baca</dt><dd id="engine">-</dd>
      <dt>Resolusi kamera</dt><dd id="res">-</dd>
      <dt>Berhasil</dt><dd id="count">0</dd>
      <dt>Rata-rata waktu baca</dt><dd id="avg">-</dd>
    </dl>
    <ol id="log"></ol>
    <div class="row" style="margin-top:10px">
      <button id="copy">Salin hasil uji</button>
      <button id="reset">Kosongkan</button>
    </div>
    <p class="hint" id="msg"></p>
  </section>
</main>

<!-- Cadangan jika BarcodeDetector tidak tersedia di perangkat -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), stream = null, running = false, engine = '', zx = null;
  var lastCode = '', lastAt = 0, t0 = 0, results = [];

  function msg(t) { $('msg').textContent = t || ''; }

  function listCams() {
    return navigator.mediaDevices.enumerateDevices().then(function (d) {
      var cams = d.filter(function (x) { return x.kind === 'videoinput'; });
      $('cams').innerHTML = cams.map(function (c, i) {
        return '<option value="' + c.deviceId + '">' + (c.label || 'Kamera ' + (i + 1)) + '</option>';
      }).join('');
    });
  }

  function onCode(code) {
    var now = Date.now();
    if (code === lastCode && now - lastAt < 1500) { lastAt = now; return; }
    lastCode = code; lastAt = now;
    var valid = /^\d{9}$/.test(code);
    var ms = now - t0;
    results.push({ code: code, valid: valid, ms: ms });
    t0 = now;
    var f = $('flash'); f.classList.add('on'); setTimeout(function () { f.classList.remove('on'); }, 80);
    try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); } catch (e) {}
    render();
  }

  function render() {
    var last = results[results.length - 1];
    $('last').innerHTML = last ? '<span class="' + (last.valid ? 'ok' : 'bad') + '">' + last.code + '</span>' : '-';
    $('count').textContent = results.length;
    $('avg').textContent = results.length ? (results.reduce(function (s, r) { return s + r.ms; }, 0) / results.length / 1000).toFixed(1) + ' detik' : '-';
    $('log').innerHTML = results.slice().reverse().map(function (r) {
      return '<li>' + r.code + (r.valid ? '' : ' (bukan 9 digit)') + ' - ' + (r.ms / 1000).toFixed(1) + ' dtk</li>';
    }).join('');
  }

  function stop() {
    running = false;
    if (zx) { try { zx.reset(); } catch (e) {} zx = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
  }

  function start() {
    stop(); msg('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg('Kamera tidak tersedia. Halaman harus dibuka lewat https.'); return;
    }
    var deviceId = $('cams').value;
    var useNative = 'BarcodeDetector' in window;
    var begin = useNative && BarcodeDetector.getSupportedFormats
      ? BarcodeDetector.getSupportedFormats().then(function (f) { return f.indexOf('code_128') >= 0; })
      : Promise.resolve(useNative);
    begin.then(function (native) {
      t0 = Date.now(); running = true;
      if (native) return startNative(deviceId);
      return startZXing(deviceId);
    }).catch(function (e) {
      running = false;
      msg(e && e.name === 'NotAllowedError'
        ? 'Izin kamera ditolak. Izinkan kamera pada ikon gembok di address bar. Jika tetap gagal, kebijakan Chromebook sekolah mungkin memblokir kamera.'
        : 'Gagal membuka kamera: ' + (e && e.message ? e.message : e));
    });
  }

  function startNative(deviceId) {
    engine = 'BarcodeDetector bawaan Chrome';
    var det = new BarcodeDetector({ formats: ['code_128'] });
    var c = { video: { width: { ideal: 1280 }, height: { ideal: 720 } } };
    if (deviceId) c.video.deviceId = { exact: deviceId }; else c.video.facingMode = 'environment';
    return navigator.mediaDevices.getUserMedia(c).then(function (s) {
      stream = s; video.srcObject = s; return video.play();
    }).then(function () {
      var st = stream.getVideoTracks()[0].getSettings();
      $('engine').textContent = engine; $('res').textContent = st.width + 'x' + st.height;
      listCams();
      (function loop() {
        if (!running) return;
        det.detect(video).then(function (r) { if (r.length) onCode(r[0].rawValue); })
          .catch(function () {}).then(function () { setTimeout(loop, 90); });
      })();
    });
  }

  function startZXing(deviceId) {
    engine = 'ZXing (cadangan)';
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zx = new ZXing.BrowserMultiFormatReader(hints, 150);
    $('engine').textContent = engine;
    return zx.decodeFromVideoDevice(deviceId || null, video, function (res) {
      if (res) onCode(res.getText());
    }).then(function () {
      var st = video.srcObject && video.srcObject.getVideoTracks()[0].getSettings();
      $('res').textContent = st ? st.width + 'x' + st.height : '-';
      listCams();
    });
  }

  $('start').onclick = start;
  $('stop').onclick = stop;
  $('reset').onclick = function () { results = []; lastCode = ''; render(); };
  $('copy').onclick = function () {
    var ok = results.filter(function (r) { return r.valid; }).length;
    var txt = 'Uji kamera | ' + navigator.userAgent + '\nMesin: ' + $('engine').textContent +
      '\nResolusi: ' + $('res').textContent + '\nBerhasil: ' + ok + ' dari ' + results.length +
      '\nRata-rata: ' + $('avg').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      function () { msg('Hasil disalin.'); }, function () { msg(txt); });
  };

  if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) listCams();
  window.addEventListener('pagehide', stop);
})();
</script>
</body>
</html>
